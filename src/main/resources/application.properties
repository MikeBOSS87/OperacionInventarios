# Configuracion Micro Servicio
spring.application.name=CatalogosInventarios
server.port=8530

# ============================
# DATASOURCE
# ============================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//85.215.168.124:1521/XEPDB1
spring.datasource.username=USREJECUTOR
spring.datasource.password=Ejecutor

# ============================
# HIKARI CONNECTION POOL
# ============================
spring.datasource.hikari.pool-name=HikariPool-Catalogos
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# Validación de conexión
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.sql.init.mode=never